<div class="add-flight-container">
  <h2>Add Flight</h2>
  <form (ngSubmit)="onSubmit()" #flightForm="ngForm">
    <div class="form-group">
      <label for="flightNumber">Flight Number:</label>
      <input
        type="text"
        id="flightNumber"
        name="flightNumber"
        class="form-control"
        [(ngModel)]="flight.flightNumber"
        required
      />
    </div>

    <div class="form-group">
      <label for="departure">Departure:</label>
      <input
        type="text"
        id="departure"
        name="departure"
        class="form-control"
        [(ngModel)]="flight.departure"
        required
      />
    </div>

    <div class="form-group">
      <label for="arrival">Arrival:</label>
      <input
        type="text"
        id="arrival"
        name="arrival"
        class="form-control"
        [(ngModel)]="flight.arrival"
        required
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!flightForm.form.valid">
      Add Flight
    </button>
  </form>
</div>
```
