  <div class="add-booking-form">
    <h2>Add Booking</h2>
    <form (ngSubmit)="addbooking()">
      <div>
        <label for="bookingId">Booking ID:</label>
        <input type="number" id="bookingId" [(ngModel)]="booking.bookingId" name="bookingId" required>
      </div>
      <div>
        <label for="userId">User ID:</label>
        <input type="number" id="userId" [(ngModel)]="booking.userId" name="userId" required>
      </div>
      <div>
        <label for="bookingDate">Booking Date:</label>
        <input type="date" id="bookingDate" [(ngModel)]="booking.bookingDate" name="bookingDate" required>
      </div>
      <div>
        <label for="ticketCost">Ticket Cost:</label>
        <input type="number" id="ticketCost" [(ngModel)]="booking.ticketCost" name="ticketCost" required>
      </div>
      <div>
        <label for="flightNumber">Flight Number:</label>
        <input type="number" id="flightNumber" [(ngModel)]="booking.flight" name="flightNumber" required>
      </div>
      <div>
        <label for="noOfPassangers">Number of Passengers:</label>
        <input type="number" id="noOfPassangers" [(ngModel)]="booking.noOfPassangers" name="noOfPassangers" required>
      </div>
      <div>
        <label for="schedule">schedule_id:</label>
        <input type="number" id="schedule" placeholder="enter the schedule_id" name="schedule" [(ngModel)]="booking.schedule">
      </div>
      <div>
        <button type="submit">Add Booking</button>
      </div>
    </form>
  </div>
