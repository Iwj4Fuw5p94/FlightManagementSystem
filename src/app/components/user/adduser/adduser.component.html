<div class="container">
    <form #userForm="ngForm" (ngSubmit)="addUser()" >
      <div class="form-group">
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="firstname" [(ngModel)]="user.firstname" class="form-control"  >
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" [(ngModel)]="user.email" class="form-control" >
      </div>
      <div class="form-group">
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="lastname" [(ngModel)]="user.lastname" class="form-control" >
      </div>
      <div class="form-group">
        <label for="userId">User ID:</label>
        <input type="number" id="userId" name="userId" [(ngModel)]="user.userId" class="form-control" >
      </div>
      <div class="form-group">
        <label for="userphone">User Phone:</label>
        <input type="text" id="userphone" name="userphone" [(ngModel)]="user.userphone" class="form-control" >
      </div>
      <div class="form-group">
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" [(ngModel)]="user.address" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
      <button type="submit" class="btn btn-success">Update</button>
    </form>
  </div>
